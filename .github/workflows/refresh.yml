name: Refresh event data

on:
  schedule:
    # Every 6 hours. The dashboard warns if the data is more than 26 hours old,
    # so a couple of consecutive failures are visible without being noisy.
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  # write is needed to persist state/seen.json, which is how the notifier knows
  # an event is new. Pushes made with GITHUB_TOKEN do not re-trigger workflows,
  # so this cannot loop.
  contents: write
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a scheduled run
# cannot discard a manual one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Test timestamp handling
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect events
        run: node scripts/collect.mjs

      # collect.mjs throws rather than writing an empty snapshot, so reaching
      # this step means site/data.json holds a real result.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # A Discord misconfiguration must not block the dashboard deploy. notify
      # leaves state untouched when it cannot deliver, so a failed run simply
      # retries the same alerts next time; the red step makes it visible.
      - name: Notify new events
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/notify.mjs

      # Persisted after the alert so a failed post cannot mark events as seen.
      - name: Persist notification state
        run: |
          if [ -n "$(git status --porcelain state/seen.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore: update notification state [skip ci]"
            git pull --rebase --autostash origin main
            git push
          else
            echo "No state change to persist."
          fi

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
